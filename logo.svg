<svg width="180" height="60" viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Hauptgradient für IGS Text (rot zu orange-gelb) -->
    <linearGradient id="igsGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e63946;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#f77f00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fcbf49;stop-opacity:1" />
    </linearGradient>
    
    <!-- Schatten-Gradient für 3D-Effekt -->
    <linearGradient id="shadowGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b1e1e;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#5a0f0f;stop-opacity:0.9" />
    </linearGradient>
    
    <!-- Filter für erweiterte 3D-Schatten -->
    <filter id="textShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="5" dy="6" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.7"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
    
    <!-- Filter für Hintergrund-Schatten -->
    <filter id="bgShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
    </filter>
  </defs>
  
  <!-- Schwarzer Hintergrund -->
  <rect width="200" height="100" fill="#000000"/>
  
  <!-- Horizontale orange Linien im Hintergrund -->
  <line x1="0" y1="12" x2="200" y2="12" stroke="#f77f00" stroke-width="0.8" opacity="0.5"/>
  <line x1="0" y1="25" x2="200" y2="25" stroke="#f77f00" stroke-width="0.6" opacity="0.4"/>
  <line x1="0" y1="75" x2="200" y2="75" stroke="#f77f00" stroke-width="0.8" opacity="0.5"/>
  <line x1="0" y1="88" x2="200" y2="88" stroke="#f77f00" stroke-width="0.6" opacity="0.4"/>
  
  <!-- Abstrakte halbtransparente rot-orange Quadrate und Rechtecke -->
  <rect x="15" y="18" width="28" height="22" fill="#e63946" opacity="0.25" rx="1" filter="url(#bgShadow)"/>
  <rect x="155" y="62" width="32" height="24" fill="#f77f00" opacity="0.2" rx="1" filter="url(#bgShadow)"/>
  <rect x="45" y="68" width="24" height="18" fill="#fcbf49" opacity="0.15" rx="1" filter="url(#bgShadow)"/>
  <rect x="8" y="52" width="18" height="16" fill="#e63946" opacity="0.2" rx="1" filter="url(#bgShadow)"/>
  <rect x="170" y="20" width="20" height="15" fill="#f77f00" opacity="0.18" rx="1" filter="url(#bgShadow)"/>
  
  <!-- IGS Text mit mehreren Ebenen für 3D-Effekt -->
  <!-- Schatten-Ebene -->
  <text x="100" y="70" font-family="Arial Black, Impact, sans-serif" font-size="52" font-weight="900" 
        text-anchor="middle" fill="url(#shadowGradient)" opacity="0.8" transform="translate(4, 6)">IGS</text>
  
  <!-- Haupttext mit Gradient -->
  <text x="100" y="70" font-family="Arial Black, Impact, sans-serif" font-size="52" font-weight="900" 
        text-anchor="middle" fill="url(#igsGradient)" filter="url(#textShadow)">IGS</text>
  
  <!-- Highlight-Ebene für zusätzliche Tiefe -->
  <text x="100" y="48" font-family="Arial Black, Impact, sans-serif" font-size="52" font-weight="900" 
        text-anchor="middle" fill="url(#igsGradient)" opacity="0.3" transform="translate(0, -20)">IGS</text>
</svg>